name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install FFmpeg
        run: |
          # apt-get update can hang on a hosted runner mirror; use pinned npm binaries for CI only.
          npm install --prefix "$RUNNER_TEMP/media-tools" --no-save --ignore-scripts --no-audit --no-fund \
            @ffmpeg-installer/linux-x64@4.1.0 ffprobe-static@3.1.0
          chmod +x "$RUNNER_TEMP/media-tools/node_modules/ffprobe-static/bin/linux/x64/ffprobe"
          "$RUNNER_TEMP/media-tools/node_modules/ffprobe-static/bin/linux/x64/ffprobe" -version >/dev/null
          echo "$RUNNER_TEMP/media-tools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/media-tools/node_modules/ffprobe-static/bin/linux/x64" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck server
        run: cd server && npm run typecheck

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev
          cd server && npm run audit:prod

      - name: Test
        run: npm run test
      - name: Apps2Samsung workflow contract checks (offline)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_tizen_wgt_workflow.py

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t streamvault-ci:packet .
      - name: Test server in packaged runtime
        run: |
          docker run --rm -v "$PWD:/checkout" -w /checkout/server streamvault-ci:packet \
            npm run test -- --run --no-file-parallelism --maxWorkers=1 --testTimeout=30000
          docker run --rm -v "$PWD:/checkout" -w /checkout/server/src streamvault-ci:packet \
            /usr/bin/python3 -m unittest -v test_live_packet_worker

  arm64-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ARM64 runtime with PyAV
        run: |
          docker build -t streamvault-ci:arm64 .
          docker run --rm streamvault-ci:arm64 /usr/bin/python3 -c 'import av; print(av.__version__)'

name: Build Tizen WGT

# Builds both Samsung TV flavours and uploads them UNSIGNED. Manual only;
# optionally publish both in a single GitHub release.
#
# Why unsigned: a Samsung TV installs a widget only when its distributor
# signature comes from a Samsung certificate that names that TV's DUID, and it
# updates one only when the author signature matches the previous install.
# Neither can come from a shared runner — the first is per TV, the second has
# to stay the same forever. So the runner does the part that is the same for
# everyone (build + package) and Apps2Samsung signs for the destination TV.
# For a manual installation, use your own Certificate Manager profile:
#
#   tizen package -t wgt -s <your profile> -- StreamVault-<target>-unsigned.wgt
#
# or, with the certificates this repo's scripts expect, unzip it into dist/ and
# run `node scripts/sign-wgt.cjs`. Either way the widget is signed once, on the
# machine that has the certificates, and every later build updates in place.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish both unsigned .wgt files in one GitHub release'
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs. The build job — the
# one that runs a downloaded toolchain and npm lifecycle scripts — never holds
# a token that can write to the repository.
permissions: {}

# No `run:` step in this file interpolates a ${{ }} expression: everything a
# script reads arrives through env, so a value from the repository (the widget
# version) is data to the shell, never part of the command.
jobs:
  wgt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Public widgets must ask for the backend URL on the TV, never embed a
      # runner/private LAN address (URL takes precedence over IP in Vite).
      VITE_SERVER_URL: ''
      VITE_SERVER_IP: ''
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, validate and package both flavours (unsigned)
        run: |
          set -euo pipefail
          test -z "$VITE_SERVER_URL" && test -z "$VITE_SERVER_IP" || {
            echo '::error::Public widgets must have no preconfigured backend'; exit 1; }
          node --input-type=module -e "import { resolveBuildServerUrl } from './src/utils/server-connection.ts'; if (resolveBuildServerUrl(process.env) !== '') process.exit(1)"
          mkdir -p out
          for TARGET in tizen5 default; do
            if [ "$TARGET" = tizen5 ]; then
              npm run build:tizen5
              WANT=5.0
            else
              npm run build:wgt
              WANT=6.5
            fi
            test -f dist/config.xml && test -f dist/index.html || {
              echo "::error::$TARGET build lacks config.xml or index.html"; exit 1; }
            # A WGT starts at a local index.html, never at the web server root.
            grep -E 'src="\./assets/[^\"]+\.js"' dist/index.html >/dev/null || {
              echo "::error::$TARGET lacks a relative asset script"; exit 1; }
            grep -E 'href="\./assets/[^\"]+\.css"' dist/index.html >/dev/null || {
              echo "::error::$TARGET lacks a relative asset stylesheet"; exit 1; }
            if grep -E '(src|href)="/' dist/index.html >/dev/null; then
              echo "::error::$TARGET has root-relative asset references"; exit 1
            fi
            if grep -E 'crossorigin' dist/index.html >/dev/null; then
              echo "::error::$TARGET has crossorigin on local widget assets"; exit 1
            fi
            test ! -e dist/sw.js || {
              echo "::error::$TARGET unexpectedly contains a web service worker"; exit 1; }
            # A 5.0 manifest with the modern bundle (or vice versa) cannot run.
            FLOOR="$(grep -o 'required_version="[^"]*"' dist/config.xml | sed -E 's/.*"([^"]*)"/\1/')"
            [ "$FLOOR" = "$WANT" ] || {
              echo "::error::$TARGET manifest requires $FLOOR, expected $WANT"; exit 1; }
            if [ "$TARGET" = tizen5 ]; then
              ! grep -q '<script type="module"' dist/index.html || {
                echo '::error::tizen5 still loads a module script'; exit 1; }
              compgen -G 'dist/assets/*-legacy*.js' >/dev/null || {
                echo '::error::tizen5 has no legacy bundle'; exit 1; }
            fi
            # A .wgt is a zip of the widget root; signing happens per TV later.
            WGT="out/StreamVault-$TARGET-unsigned.wgt"
            (cd dist && zip -q -r -X "../$WGT" .)
            unzip -tq "$WGT"
            ENTRIES="$(unzip -Z -1 "$WGT")"
            printf '%s\n' "$ENTRIES" | grep -Fx config.xml >/dev/null
            printf '%s\n' "$ENTRIES" | grep -Fx index.html >/dev/null
            if printf '%s\n' "$ENTRIES" | grep -E '(^|/)(author-signature\.xml|signature[0-9]*\.xml)$' >/dev/null; then
              echo "::error::$TARGET archive contains signatures"; exit 1
            fi
            cmp dist/config.xml <(unzip -p "$WGT" config.xml)
            echo "$WGT: required_version=$FLOOR, unsigned, archive OK"
          done

      - name: Release metadata
        id: meta
        run: |
          # The <widget> element's version, not the XML prolog's.
          VERSION="$(tr -d '\n' < public/config.xml | grep -o '<widget[^>]*' | grep -o ' version="[^"]*"' | sed -E 's/.*"([^"]*)"/\1/')"
          VERSION="${VERSION:-0.0.0}"
          # This ends up in a git tag and a release title, so accept nothing
          # but a version: digits and dots, no shell metacharacters, no spaces.
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$' || {
            echo "::error::public/config.xml has an unusable widget version: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: StreamVault-unsigned-wgts
          path: out/*.wgt
          if-no-files-found: error

  release:
    if: ${{ inputs.release }}
    needs: wgt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: StreamVault-unsigned-wgts
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.wgt.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Never publish a partial release; check the downloaded artifacts too.
          files=(out/*.wgt)
          [ "${#files[@]}" -eq 2 ]
          for target in tizen5 default; do
            wgt="out/StreamVault-$target-unsigned.wgt"
            test -f "$wgt"
            unzip -tq "$wgt"
          done
          TAG="wgt-v$VERSION-$RUN_ID-$RUN_ATTEMPT"
          {
            printf 'Unsigned StreamVault widgets built from `%s`: `tizen5` (Tizen 5.0/5.5) and `default` (Tizen 6.5+).\n\n' "$SHA"
            printf 'A StreamVault backend on your LAN is required; set its URL in the TV app Settings after installing. No backend URL is embedded in these builds.\n\n'
            printf 'Use Apps2Samsung to install the appropriate `.wgt` (it signs for your TV), or sign with your own Samsung Certificate Manager profile before installing. Keep the same author certificate for updates. See README for steps.\n'
          } > notes.md
          # A failed upload or readback must not leave a partial public release.
          # This tag is unique to the run attempt; never overwrite an older run.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"; exit 1
          fi
          release_started=0
          cleanup_on_failure() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$release_started" -eq 1 ]; then
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag ||
                echo "::error::Failed to clean up release $TAG; delete its draft and tag manually"
            fi
            exit "$status"
          }
          trap cleanup_on_failure EXIT
          release_started=1
          gh release create "$TAG" \
            --repo "$REPO" --target "$SHA" --draft \
            --title "StreamVault widgets v$VERSION (run $RUN_ID)" \
            --notes-file notes.md
          gh release upload "$TAG" "${files[@]}" --repo "$REPO"
          # Read back the server's asset list, not just the upload exit code.
          expected=$(printf '%s\n' StreamVault-default-unsigned.wgt StreamVault-tizen5-unsigned.wgt)
          actual=$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets \
            --jq 'if .isDraft then (.assets | map(.name) | sort | join("\n")) else error("release is not a draft") end')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release assets do not match the two built widgets"; exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false
          release_started=0

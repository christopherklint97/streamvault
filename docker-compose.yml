services:
  server:
    container_name: streamvault-server
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    volumes:
      - streamvault_data:/app/data
      - streamvault_recordings:/app/data/recordings
    environment:
      - TZ=Europe/Stockholm
      - LOG_LEVEL=info
      # New recordings store TS chunks only; existing recordings keep legacy playback.
      - STREAMVAULT_SEGMENTED_RECORDINGS=${STREAMVAULT_SEGMENTED_RECORDINGS:-0}
      # Stop archive capture before exhausting host disk or crowding other services.
      - STREAMVAULT_ARCHIVE_MAX_DISK_GB=${STREAMVAULT_ARCHIVE_MAX_DISK_GB:-400}
      - STREAMVAULT_ARCHIVE_RESERVE_GB=${STREAMVAULT_ARCHIVE_RESERVE_GB:-20}
      # Opt-in bounded, low-priority frame-accurate repair for fresh reconnects only.
      - STREAMVAULT_FRAME_ACCURATE_SEAMS=${STREAMVAULT_FRAME_ACCURATE_SEAMS:-0}
      - STREAMVAULT_FRAME_ACCURATE_CHANNEL_IDS=${STREAMVAULT_FRAME_ACCURATE_CHANNEL_IDS:-}
      # Optional per-channel fast retry only after a clean, publishing archive EOF.
      - STREAMVAULT_FAST_EOF_CHANNEL_IDS=${STREAMVAULT_FAST_EOF_CHANNEL_IDS:-}
      # Emergency raw-master playback for new archive tickets; preserves pinned viewers.
      - STREAMVAULT_ARCHIVE_RAW_PLAYBACK=${STREAMVAULT_ARCHIVE_RAW_PLAYBACK:-0}
      # Explicit per-channel opt-in for verified copied seam pairs; empty preserves raw fallback.
      - STREAMVAULT_ARCHIVE_PAIR_CHANNEL_IDS=${STREAMVAULT_ARCHIVE_PAIR_CHANNEL_IDS:-}
      # Optional hardening. If set, browser clients must enter the same value
      # in Settings under Backend token.
      - STREAMVAULT_AUTH_TOKEN=${STREAMVAULT_AUTH_TOKEN:-}
      # Comma-separated extra hosts allowed for /api/proxy, in addition to the
      # configured Xtream server host.
      - STREAMVAULT_PROXY_ALLOWED_HOSTS=${STREAMVAULT_PROXY_ALLOWED_HOSTS:-}
      # Comma-separated explicit CORS origins. Empty keeps current LAN-friendly behavior.
      - STREAMVAULT_ALLOWED_ORIGINS=${STREAMVAULT_ALLOWED_ORIGINS:-}
    # Leave capacity for SSH, DNS and other host services during transcoding.
    cpus: "2.0"
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 256
    blkio_config:
      weight: 100
    stop_grace_period: 30s
    healthcheck:
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  streamvault_data:
  streamvault_recordings:

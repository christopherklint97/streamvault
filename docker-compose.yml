services:
  server:
    container_name: streamvault-server
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    volumes:
      - streamvault_data:/app/data
      - streamvault_recordings:/app/data/recordings
    environment:
      - TZ=Europe/Stockholm
      - LOG_LEVEL=info
      # Shared packet-aware live HLS is the default for all video channels;
      # set 0 globally to fall back to the previous HLS worker on failure.
      - STREAMVAULT_LIVE_PACKET_AWARE=${STREAMVAULT_LIVE_PACKET_AWARE:-1}
      # New recordings store TS chunks only; existing recordings keep legacy playback.
      - STREAMVAULT_SEGMENTED_RECORDINGS=${STREAMVAULT_SEGMENTED_RECORDINGS:-0}
      # Stop archive capture before exhausting host disk or crowding other services.
      - STREAMVAULT_ARCHIVE_MAX_DISK_GB=${STREAMVAULT_ARCHIVE_MAX_DISK_GB:-400}
      - STREAMVAULT_ARCHIVE_RESERVE_GB=${STREAMVAULT_ARCHIVE_RESERVE_GB:-20}
      # All enabled archives keep raw fallback and attempt verified, quota-gated pair repair.
      - STREAMVAULT_ARCHIVE_RAW_PLAYBACK=${STREAMVAULT_ARCHIVE_RAW_PLAYBACK:-1}
      # Global emergency rollback for NEW tickets only; raw masters and old pins stay intact.
      - STREAMVAULT_ARCHIVE_RAW_ONLY=${STREAMVAULT_ARCHIVE_RAW_ONLY:-0}
      # Optional hardening. If set, browser clients must enter the same value
      # in Settings under Backend token.
      - STREAMVAULT_AUTH_TOKEN=${STREAMVAULT_AUTH_TOKEN:-}
      # Comma-separated extra hosts allowed for /api/proxy, in addition to the
      # configured Xtream server host.
      - STREAMVAULT_PROXY_ALLOWED_HOSTS=${STREAMVAULT_PROXY_ALLOWED_HOSTS:-}
      # Comma-separated explicit CORS origins. Empty keeps current LAN-friendly behavior.
      - STREAMVAULT_ALLOWED_ORIGINS=${STREAMVAULT_ALLOWED_ORIGINS:-}
    # Leave capacity for SSH, DNS and other host services during transcoding.
    cpus: "2.0"
    mem_limit: 2g
    memswap_limit: 3g
    pids_limit: 256
    blkio_config:
      weight: 100
    stop_grace_period: 30s
    healthcheck:
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  streamvault_data:
  streamvault_recordings:
